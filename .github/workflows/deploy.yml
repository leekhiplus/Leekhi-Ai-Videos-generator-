name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder (unzips any .zip in repo root)
        run: |
          mkdir _site
          if ls ./*.zip >/dev/null 2>&1; then
            for z in ./*.zip; do unzip -o "$z" -d _site; done
          elif [ -f index.html ]; then
            cp index.html _site/
          fi
          idx=$(find _site -name index.html | head -n1)
          if [ -z "$idx" ]; then echo "index.html not found"; exit 1; fi
          d=$(dirname "$idx")
          if [ "$d" != "_site" ]; then cp -r "$d"/. _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
